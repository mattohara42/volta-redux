name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  GODOT_VERSION: "4.7.2-stable"

jobs:
  test:
    name: Headless tests and a screenshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import the project
        run: ~/godot/godot --headless --path . --import

      - name: Run the tests
        run: ~/godot/godot --headless --path . --script res://tests/run_tests.gd

      # An assertion proves the code ran, not that the picture is right. This
      # step boots the real build and draws a frame, which is how a rendering
      # regression gets caught by a machine rather than by somebody noticing.
      - name: Screenshot the room
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m0.tscn --out=room_m0.png \
            --input="move_right:2" --zoom=0.38 --centre=800,180 --overwrite

      # The M2 ledge is a position, and CLAUDE.md says draw a position before
      # believing it. This throws a sword into wood and photographs where the
      # ledge actually landed, which no assertion in the suite can do.
      - name: Screenshot an embedded sword
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m2.tscn --out=room_m2_embed.png \
            --input="move_left:10;throw:6;-:45" --zoom=0.5 --centre=250,240 \
            --overwrite

      # M2's first room claims it cannot be crossed without standing on your
      # own sword. tests/test_room_m2_gap.gd asserts that against the config;
      # this draws it. The player starts at the lip and throws once, so the log
      # line says where the ledge landed over the gap.
      - name: Screenshot the ledge over the gap
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m2_gap.tscn --out=room_m2_gap.png \
            --input="throw:6;-:40" --zoom=0.5 --centre=440,250 --overwrite

      # The switch room's chain is sword embeds -> switch senses -> gate opens.
      # Only the first link is arithmetic; the other two are an area overlap and
      # a signal, and running it is the only honest way to know they fire.
      - name: Screenshot the gate a sword opened
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m2_switch.tscn --out=room_m2_switch.png \
            --input="move_left:10;throw:6;-:40" --zoom=0.55 --centre=220,250 \
            --overwrite

      # M3's claim is a measurement: under a second from death to moving again.
      # This runs the player off the first ledge into lava and waits out the
      # whole loop, so the log line says how many deaths happened and what the
      # loop actually cost in a running build. It also draws the lava, which was
      # written without anybody seeing it.
      - name: Screenshot lava, and time a death
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m3.tscn --out=room_m3.png \
            --input="move_right:100;-:60" --zoom=0.55 --centre=350,220 \
            --overwrite

      # The checkpoint is the one thing in M3 that changes what a death means,
      # and whether a brazier lit is an area overlap: no assertion can reach it.
      # This crosses the easy gap, walks past the second brazier, falls in the
      # marginal gap and waits out the loop, so the log says which braziers are
      # lit and where the respawn actually put the player. A checkpoint line
      # reading 60 rather than 470 is the bug this step exists to catch.
      - name: Screenshot a respawn at a brazier
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m3.tscn --out=room_m3_brazier.png \
            --input="move_right:86;move_right,jump:20;move_right:120;-:45" \
            --zoom=1.0 --centre=470,250 --overwrite

      # Spikes are the one hazard whose drawing and whose killing box are
      # different rectangles, and a screenshot can only show the first. This
      # runs the player into the easy bed, so the log carries both boxes and
      # says the teeth killed somebody, and the picture says they look like
      # teeth. Either half alone has been wrong before.
      #
      # These two steps check the log rather than only keeping it, because a
      # bed that quietly stopped killing and a bed that quietly stopped being
      # jumpable both draw a perfectly good picture. The older steps above
      # still only keep theirs, which is in BACKLOG.md.
      - name: Screenshot the spikes, and die on them
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m3_spikes.tscn --out=room_m3_spikes.png \
            --input="move_right:80;-:60" --zoom=1.0 --centre=300,250 --overwrite \
            > spikes.log 2>&1 || { cat spikes.log; exit 1; }
          cat spikes.log
          grep -qE "capture: [1-9][0-9]* death" spikes.log || {
            echo "walking into the spikes did not kill anybody"; exit 1; }

      # And the other half: the marginal bed is meant to be jumpable. This run
      # clears it, which is the claim tests/test_room_m3_spikes.gd makes as
      # arithmetic. A death here means the bed got wider than the jump.
      - name: Jump the marginal bed
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m3_spikes.tscn \
            --out=room_m3_spikes_cleared.png \
            --input="move_right:62;move_right,jump:20;move_right:84;move_right,jump:20;move_right:40" \
            --zoom=1.0 --centre=650,250 --overwrite \
            > cleared.log 2>&1 || { cat cleared.log; exit 1; }
          cat cleared.log
          grep -q "capture: no deaths" cleared.log || {
            echo "the marginal bed killed a run that should have cleared it"; exit 1; }

      # A falling platform's whole content is a clock, and a clock is the one
      # thing a screenshot cannot show: a slab at home and a slab one frame from
      # letting go are the same picture. These two steps read the log for the
      # phase each slab is in, which is the only way to tell a platform that
      # works from a platform that is decoration.
      #
      # This one runs onto the first slab and then stands still on it, which is
      # the mistake the hazard exists to punish. The slab has to let go, carry
      # the player into the lava, and then be back at home by the time the
      # respawn hands the controls over: a route still missing two of its steps
      # when you get back to it is the wait that makes dying twenty times
      # tedious, and M3's done-when is about exactly that.
      - name: Stand on a falling platform, and ride it in
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m3_falling.tscn \
            --out=room_m3_falling.png \
            --input="move_right:60;move_right,jump:16;jump:120" \
            --zoom=1.2 --centre=380,290 --overwrite \
            > falling.log 2>&1 || { cat falling.log; exit 1; }
          cat falling.log
          grep -qE "capture: [1-9][0-9]* death" falling.log || {
            echo "standing still on a falling platform did not kill anybody"; exit 1; }
          if grep -qE "capture: platform .*(shaking|falling|gone)" falling.log; then
            echo "a platform was still missing after the respawn"; exit 1
          fi
          echo "every platform was back at home when the controls came back"

      # And the other half: the room is crossable. Four jumps per moat, taken on
      # the rhythm a player would use, which is to leave a slab as soon as they
      # land on it. A death here means the slabs stopped holding long enough to
      # be crossed, and the bench stopped measuring the death loop and started
      # measuring frustration with the room.
      - name: Cross both moats without stopping
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m3_falling.tscn \
            --out=room_m3_falling_crossed.png \
            --input="move_right:58;move_right,jump:16;move_right:12;move_right,jump:16;move_right:12;move_right,jump:16;move_right:29;move_right,jump:16;move_right:12;move_right,jump:16;move_right:12;move_right,jump:16;move_right:12;move_right,jump:16;move_right:24" \
            --zoom=1.2 --centre=880,290 --overwrite \
            > crossed.log 2>&1 || { cat crossed.log; exit 1; }
          cat crossed.log
          grep -q "capture: no deaths" crossed.log || {
            echo "the crossing killed a run that should have made it"; exit 1; }

      # A ferry has no trigger: its clock was running before the player arrived
      # and it keeps running after they die. That makes it the one mechanism so
      # far whose picture says nothing at all, so all three of these steps read
      # the log.
      #
      # This one walks at the first moat as though the room owed it a floor.
      # The ferry has already left, so the walk ends in the lava, and the two
      # platform lines then have to read "home": a respawn puts every ferry back
      # at the dock beside you, or a death costs the crossing you missed and
      # then a wait for the boat, which is what turns twenty deaths tedious.
      - name: Watch the ferry leave without you
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m3_moving.tscn \
            --out=room_m3_moving.png \
            --input="move_right:60;-:24" --zoom=1.2 --centre=200,290 --overwrite \
            > missed.log 2>&1 || { cat missed.log; exit 1; }
          cat missed.log
          grep -qE "capture: [1-9][0-9]* death" missed.log || {
            echo "walking into the moat the ferry had left did not kill anybody"; exit 1; }
          test "$(grep -cE "capture: platform .* home" missed.log)" = "2" || {
            echo "a ferry was still out in the moat after the respawn"; exit 1; }

      # The claim M3's done-when actually rests on, and the one no assertion in
      # the suite can make: that the checkpoint the room gives you is close
      # enough to the second ferry to catch it before it goes. This dies in the
      # second moat and then holds right, which is what somebody on their
      # nineteenth attempt does. It has to end up standing over the moat, which
      # is only possible on the ferry, and a second death would mean the jump
      # landed in the lava.
      #
      # 548 is RoomM3Moving.ISLAND_END: past it there is no floor.
      - name: Die in the second moat, and catch the ferry from the respawn
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m3_moving.tscn \
            --out=room_m3_moving_respawn.png \
            --input="move_right:37;-:143;move_right:17;-:76;move_right:8;move_right,jump:30;move_right:25;-:85;move_right:57;move_right,jump:30;-:40" \
            --zoom=1.0 --centre=620,270 --overwrite \
            > respawn.log 2>&1 || { cat respawn.log; exit 1; }
          cat respawn.log
          grep -qE "capture: 1 death\(s\)" respawn.log || {
            echo "the respawn missed the ferry and died again"; exit 1; }
          hero=$(sed -n 's/^capture: player at (\([0-9.]*\).*/\1/p' respawn.log)
          awk -v x="$hero" 'BEGIN { exit !(x > 548) }' || {
            echo "the hero is at $hero, which is back on the island and not on the ferry"
            exit 1; }
          echo "the hero is at $hero, out over the second moat and riding"

      # And the other half: the room is crossable. Both moats, on the rhythm a
      # player would use, which is to board a ferry while it is sitting at the
      # dock and leave it while it is sitting at the other one. A death here
      # means the ferries stopped meeting the banks they were laid out against,
      # and the bench stopped measuring the death loop and started measuring
      # frustration with the room.
      - name: Ride both ferries across
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m3_moving.tscn \
            --out=room_m3_moving_crossed.png \
            --input="move_right:37;-:143;move_right:17;-:76;move_right:8;move_right,jump:30;move_right:25;-:25;move_right,jump:30;-:109;move_right:10;move_right,jump:30;move_right:10" \
            --zoom=1.0 --centre=780,270 --overwrite \
            > ferried.log 2>&1 || { cat ferried.log; exit 1; }
          cat ferried.log
          grep -q "capture: no deaths" ferried.log || {
            echo "the crossing killed a run that should have made it"; exit 1; }

      # A geyser is the only mechanism in M3 whose failure is silence: a vent
      # that never goes off draws a perfectly good picture of a room nobody can
      # get out of. So both of these steps read the log rather than only keeping
      # the image.
      #
      # This one crosses. The pause in the middle is the whole point of the
      # room: the hero rides the first jet, walks to the lip of the moat, and
      # then waits there rather than walking into a moat with nothing coming up.
      # It has to finish on the far bank, which is a storey above the lip and
      # only reachable by being carried.
      - name: Ride a jet out of a lava moat
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m3_geysers.tscn \
            --out=room_m3_geysers.png \
            --input="move_right:110;-:75;move_right:90" \
            --zoom=1.0 --centre=430,200 --overwrite \
            > geysers.log 2>&1 || { cat geysers.log; exit 1; }
          cat geysers.log
          grep -q "capture: no deaths" geysers.log || {
            echo "the crossing killed a run that should have made it"; exit 1; }
          hero_y=$(sed -n 's/^capture: player at ([0-9.]*, \([0-9.]*\).*/\1/p' geysers.log)
          hero_x=$(sed -n 's/^capture: player at (\([0-9.]*\).*/\1/p' geysers.log)
          # 508 is RoomM3Geysers.FAR_BANK_START and 224 is the lip it was reached
          # from. Past one and above the other is the far bank and nowhere else.
          awk -v x="$hero_x" -v y="$hero_y" 'BEGIN { exit !(x > 508 && y < 224) }' || {
            echo "the hero is at $hero_x, $hero_y, which is not up on the far bank"
            exit 1; }
          echo "the hero is at $hero_x, $hero_y, a storey above the lip it started from"

      # And the half that dies. This one walks the room without reading the
      # clock, steps off the lip while the vent is quiet, and falls in.
      #
      # What it is really testing is the respawn. A geyser's clock was running
      # before the player arrived and keeps running after they die, so a respawn
      # puts every vent back at the first frame of its swell: the run out of the
      # mid brazier then always meets a jet that is already up. Left running
      # instead, this exact script dies a second time in the same moat and ends
      # back on the ledge, which is what makes one death the assertion rather
      # than any death.
      - name: Step off the lip with nothing coming up
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m3_geysers.tscn \
            --out=room_m3_geysers_respawn.png \
            --input="move_right:110;-:157;move_right:170" \
            --zoom=1.0 --centre=500,180 --overwrite \
            > geysers_respawn.log 2>&1 || { cat geysers_respawn.log; exit 1; }
          cat geysers_respawn.log
          grep -qE "capture: 1 death\(s\)" geysers_respawn.log || {
            echo "either the quiet moat did not kill anybody, or the respawn missed the jet"
            exit 1; }
          hero_x=$(sed -n 's/^capture: player at (\([0-9.]*\).*/\1/p' geysers_respawn.log)
          awk -v x="$hero_x" 'BEGIN { exit !(x > 508) }' || {
            echo "the hero is at $hero_x, which is short of the far bank"; exit 1; }
          echo "one death, and the respawn caught the next jet"

      # M4's first bench: four of the six from SPEC.md's table, none of them
      # painted yet. An overview first, the way room_m0 gets one, so a layout
      # regression is a picture and not only a log line.
      - name: Screenshot the enemy bench
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m4_enemies.tscn --out=room_m4_enemies.png \
            --input="-:12" --zoom=0.34 --centre=500,220 --overwrite

      # SPEC.md puts animals on the same kill list as lava and spikes: contact
      # kills regardless of which enemy or which side of it. This walks at the
      # scorpion and waits out its patrol, which sweeps the whole zone in
      # under a period either way.
      - name: Walk into an enemy and die
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m4_enemies.tscn \
            --out=room_m4_touch.png \
            --input="move_right:80;-:200" --zoom=1.0 --centre=280,300 --overwrite \
            > touch.log 2>&1 || { cat touch.log; exit 1; }
          cat touch.log
          grep -qE "capture: [1-9][0-9]* death" touch.log || {
            echo "standing in the scorpion's patrol did not kill anybody"; exit 1; }

      # The scorpion is the one enemy with a side to its armour. This throws
      # while it is still walking away from the player, which is a hit on its
      # back: SPEC.md's "must be hit from behind" landing, both dying, the
      # sword included.
      - name: Kill the scorpion from behind
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m4_enemies.tscn \
            --out=room_m4_scorpion_behind.png \
            --input="move_right:45;throw:6;-:40" --zoom=1.0 --centre=280,300 --overwrite \
            > behind.log 2>&1 || { cat behind.log; exit 1; }
          cat behind.log
          grep -q "capture: no deaths" behind.log || {
            echo "the hero should not have died throwing from a safe distance"; exit 1; }
          grep -q "scorpion alive" behind.log && {
            echo "a hit from behind should have killed the scorpion"; exit 1; }
          echo "the scorpion is gone, and the hero never took a hit"

      # And the mistake the armour exists to punish: this waits for the
      # scorpion's return leg, so it is walking toward the player, and throws
      # into its front. The armour has to bounce it: the sword is still gone,
      # but the scorpion is not.
      - name: Bounce a sword off the scorpion's front
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m4_enemies.tscn \
            --out=room_m4_scorpion_front.png \
            --input="-:150;move_right:45;throw:6;-:30" --zoom=1.0 --centre=280,300 \
            --overwrite \
            > front.log 2>&1 || { cat front.log; exit 1; }
          cat front.log
          grep -q "scorpion alive" front.log || {
            echo "a front hit should have bounced off the armour, not killed it"; exit 1; }
          grep -q "capture: no deaths" front.log || {
            echo "the hero should not have died throwing from a safe distance"; exit 1; }
          echo "the armour held, and the scorpion is still walking its patrol"

      # The dragon: SPEC.md's mini-boss, and the one whose whole fight rests
      # on a sword's own state rather than on anything a room can assert.
      # An overview first, the way every other bench gets one.
      - name: Screenshot the dragon's arena
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m4_dragon.tscn --out=room_m4_dragon.png \
            --input="debug_toggle_overlay:1;-:12" --zoom=0.7 --centre=280,260 --overwrite

      # SPEC.md's mistake: a fresh throw is ammunition and the dragon is
      # immune to it. This climbs the ledge, drops to the floor in front of
      # the dragon, and throws straight at the body: the sword has to be
      # gone and the dragon still has to be standing there afterward.
      - name: Bounce the only sword off the dragon's body
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m4_dragon.tscn \
            --out=room_m4_dragon_bounce.png \
            --input="move_right:18;move_right,jump:8;move_right:24;move_right:20;-:5;throw:6;-:30" \
            --zoom=1.0 --centre=280,280 --overwrite \
            > dragon_bounce.log 2>&1 || { cat dragon_bounce.log; exit 1; }
          cat dragon_bounce.log
          grep -q "capture: no deaths" dragon_bounce.log || {
            echo "throwing from a safe distance should not have killed the hero"; exit 1; }
          grep -q "dragon.*alive" dragon_bounce.log || {
            echo "a fresh throw should have bounced off the dragon, not killed it"; exit 1; }
          echo "the sword is gone and the dragon is still there"

      # The breath. This climbs the ledge and drops just past it, into the
      # one stretch of floor the cone can still reach, and waits out a full
      # period: whichever part of the cycle the clock is in when the run
      # starts, a breath has to come round and kill anybody still standing
      # there by the end of it.
      - name: Get caught by the dragon's breath
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m4_dragon.tscn \
            --out=room_m4_dragon_breath.png \
            --input="move_right:18;move_right,jump:8;move_right:25;-:3;move_right:4;-:230" \
            --zoom=1.0 --centre=220,280 --overwrite \
            > dragon_breath.log 2>&1 || { cat dragon_breath.log; exit 1; }
          cat dragon_breath.log
          grep -qE "capture: [1-9][0-9]* death" dragon_breath.log || {
            echo "standing where the breath reaches did not kill anybody over a full period"; exit 1; }

      # The one legitimate shot. SPEC.md: beaten with recall, not ammunition,
      # and BUILD_PLAN.md's M11 done-when adds without spending a sword on
      # it, so the room hands out exactly one. This throws it from the ledge,
      # over the dragon's body and into the wood past it, drops to the floor
      # clear of the body, and holds to recall: the sword has to come home
      # through the dragon, killing it, and end up back in the hero's hand.
      - name: Embed past the dragon and recall it home through the body
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m4_dragon.tscn \
            --out=room_m4_dragon_recall.png \
            --input="move_right:18;move_right,jump:8;move_right:24;throw:6;-:40;move_right:20;-:5;throw:25;-:20" \
            --zoom=1.0 --centre=280,280 --overwrite \
            > dragon_recall.log 2>&1 || { cat dragon_recall.log; exit 1; }
          cat dragon_recall.log
          grep -q "capture: no deaths" dragon_recall.log || {
            echo "the hero should not have died pulling this off"; exit 1; }
          grep -q "capture: no enemies remaining" dragon_recall.log || {
            echo "the recall should have killed the dragon"; exit 1; }
          grep -q "1 sword(s) held" dragon_recall.log || {
            echo "BUILD_PLAN.md's M11 done-when is beating the dragon without spending a sword: it should have come home"
            exit 1; }
          echo "the dragon is dead and the sword came home"

      # The floor plate: BACKLOG.md's floor-switch idea, finally buildable now
      # that M4 has enemies to weigh one down. An overview first, the way
      # every bench gets one.
      - name: Screenshot the floor plate bench
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m4_plate.tscn --out=room_m4_plate.png \
            --input="-:5" --zoom=1.0 --centre=250,260 --overwrite

      # The honest case: the hero's own weight opens the gate.
      - name: Stand on the plate and open the gate
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m4_plate.tscn \
            --out=room_m4_plate_open.png \
            --input="move_right:65;-:10" --zoom=1.0 --centre=250,260 --overwrite \
            > plate_open.log 2>&1 || { cat plate_open.log; exit 1; }
          cat plate_open.log
          grep -q "plate at .* HELD" plate_open.log || {
            echo "standing on the plate should have held it down"; exit 1; }
          grep -q "gate at .* OPEN" plate_open.log || {
            echo "the gate should have opened with the plate held"; exit 1; }

      # The puzzle BACKLOG.md actually wanted: miss the catch on purpose (a
      # ladder breaks the flat return, per SwordFlight's own "you miss by
      # changing height" rule), leaving the sword grounded on the plate so
      # the gate stays open with nobody standing on it.
      - name: Leave a sword on the plate and walk away
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m4_plate.tscn \
            --out=room_m4_plate_sword.png \
            --input="move_right:65;move_left:2;-:5;throw:6;-:5;climb_up:80;climb_up,move_right:20;climb_up,move_left:20;-:30" \
            --zoom=1.0 --centre=250,260 --overwrite \
            > plate_sword.log 2>&1 || { cat plate_sword.log; exit 1; }
          cat plate_sword.log
          grep -q "sword grounded" plate_sword.log || {
            echo "the missed throw should have landed grounded, not caught or destroyed"; exit 1; }
          grep -q "plate at .* HELD" plate_sword.log || {
            echo "the grounded sword should have held the plate down"; exit 1; }
          grep -q "gate at .* OPEN" plate_sword.log || {
            echo "the gate should be open with the sword weighing the plate"; exit 1; }
          echo "the sword is holding the gate open with nobody standing on the plate"

      # The dormant enemy: LEVELS.md's skeleton idea, generalised, and the
      # other half of the plate proof above. An overview first, the way every
      # bench gets one: a scorpion sitting motionless on the plate, already
      # holding the gate open, before the hero has done anything at all.
      - name: Screenshot the dormant bench
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m4_dormant.tscn --out=room_m4_dormant.png \
            --input="-:10" --zoom=1.0 --centre=200,260 --overwrite \
            > dormant_overview.log 2>&1 || { cat dormant_overview.log; exit 1; }
          cat dormant_overview.log
          grep -q "scorpion (dormant) alive" dormant_overview.log || {
            echo "the scorpion should start dormant"; exit 1; }
          grep -q "plate at .* HELD" dormant_overview.log || {
            echo "the dormant scorpion's own weight should hold the plate down"; exit 1; }
          grep -q "gate at .* OPEN" dormant_overview.log || {
            echo "the gate should already be open before the hero arrives"; exit 1; }

      # The surprise: decoration that turns out to be alive. This walks close
      # enough to cross `dormant_wake_range` but stops short of contact, so
      # the proof is the wake itself and not the death waking it up can cause.
      - name: Wake the dormant scorpion by approaching it
        run: |
          xvfb-run -a ~/godot/godot --path . --resolution 1280x720 \
            --script res://tools/capture.gd -- \
            --scene=res://scenes/rooms/room_m4_dormant.tscn \
            --out=room_m4_dormant_wake.png \
            --input="move_right:50" --zoom=1.0 --centre=220,260 --overwrite \
            > dormant_wake.log 2>&1 || { cat dormant_wake.log; exit 1; }
          cat dormant_wake.log
          grep -q "capture: no deaths" dormant_wake.log || {
            echo "approaching alone should not have killed the hero"; exit 1; }
          grep -q "scorpion alive" dormant_wake.log || {
            echo "getting this close should have woken the scorpion"; exit 1; }
          echo "the scorpion woke up before it was ever touched"

      - name: Keep the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            room_m0.png
            room_m2_embed.png
            room_m2_gap.png
            room_m2_switch.png
            room_m3.png
            room_m3_brazier.png
            room_m3_spikes.png
            room_m3_spikes_cleared.png
            room_m3_falling.png
            room_m3_falling_crossed.png
            room_m3_moving.png
            room_m3_moving_respawn.png
            room_m3_moving_crossed.png
            room_m3_geysers.png
            room_m3_geysers_respawn.png
