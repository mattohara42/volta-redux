name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  GODOT_VERSION: "4.7.2-stable"

jobs:
  test:
    name: Headless tests and the capture scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Install Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      # Every command below goes through tools/dev.sh, the same one a session
      # runs locally, per CLAUDE.md: "it is what CI runs, so a command that
      # works there works here."
      - name: Import the project
        run: GODOT=~/godot/godot tools/dev.sh import

      - name: Run the tests
        run: GODOT=~/godot/godot tools/dev.sh test

      # An assertion proves the code ran, not that the picture is right.
      # tools/scenarios_data.py carries the 28 capture-and-check scenarios
      # this used to run as one shell step per scenario, inline in this file:
      # a throw that never embedded, a switch that stopped sensing, a ferry
      # that missed its dock. `tools/dev.sh scenarios` runs all of them
      # locally with the same command, filterable by name for a quick check
      # on one room while working on it (`tools/dev.sh scenarios dragon`).
      #
      # Every scenario runs regardless of an earlier one failing, and prints
      # its own screenshot either way, so a failure here does not also hide
      # the pictures for everything after it.
      - name: Run the capture scenarios
        run: GODOT=~/godot/godot tools/dev.sh scenarios

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            room_m0.png
            room_m2_embed.png
            room_m2_gap.png
            room_m2_switch.png
            room_m3.png
            room_m3_brazier.png
            room_m3_spikes.png
            room_m3_spikes_cleared.png
            room_m3_falling.png
            room_m3_falling_crossed.png
            room_m3_moving.png
            room_m3_moving_respawn.png
            room_m3_moving_crossed.png
            room_m3_geysers.png
            room_m3_geysers_respawn.png
            room_m4_enemies.png
            room_m4_touch.png
            room_m4_scorpion_behind.png
            room_m4_scorpion_front.png
            room_m4_dragon.png
            room_m4_dragon_bounce.png
            room_m4_dragon_breath.png
            room_m4_dragon_recall.png
            room_m4_plate.png
            room_m4_plate_open.png
            room_m4_plate_sword.png
            room_m4_dormant.png
            room_m4_dormant_wake.png
          if-no-files-found: ignore
